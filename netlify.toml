[build]
  publish = "public"
  command = "node build/build.mjs"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/psa/"
  to = "/board-and-train/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
